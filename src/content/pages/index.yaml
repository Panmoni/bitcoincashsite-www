pillars:
  chip: The short version
  title: Three things BCH does well.
  intro: Cheap, fast payments. Tokens built into the coin. Bitcoin Script with the limits lifted. Each one works on mainnet today.
  items:
    - kicker: Money
      title: No gas. Postage.
      description: You pay a flat rate per byte, not a bid in a gas auction. A typical payment costs about a tenth of a cent, and it shows up in the other wallet in seconds.
      icon: tabler:mail-dollar
      url: /spend
      tone: green
    - kicker: Tokens
      title: Tokens with no approvals to drain.
      description: CashTokens live inside the coin itself. There is no token contract, no approve(), no admin key and no upgradeable proxy. Minting one costs under a cent.
      icon: tabler:coins
      url: /cashtokens
      tone: yellow
    - kicker: Lab
      title: Bitcoin's covenant lab.
      description: "Covenants, introspection, big-number math, loops and functions: ideas Bitcoin Core (BTC) still debates already run on BCH mainnet. Try them for a fraction of a cent."
      icon: tabler:flask
      url: /build
      tone: blue

steps:
  chip: 4 steps
  title: Get started with BCH.
  intro: Take your time at each step. Nobody can reverse a payment for you, so learn your tools first.
  walletLink: Pick a wallet →
  items:
    - title: Download a Wallet
      description: Pick an open-source, self-custody wallet. Send yourself a few cents first and learn how it works.
      icon: tabler:download
    - title: Back up your Recovery Phrase
      description: Your recovery phrase is your money. Write it down, store copies in more than one safe place, and never type it into a website.
      icon: tabler:lock
    - title: Get some BCH
      description: Earn it, or buy a small amount from a reputable exchange or trader. Start small while you learn.
      icon: tabler:currency-bitcoin
    - title: Ready!
      description: Send, receive, spend, mint a token, or deploy your first contract.
      icon: tabler:check

specs:
  chip: Spec sheet
  title: The numbers.
  intro: The figures behind the claims, as they stand today.
  items:
    - label: Typical fee
      figure: ~$0.001
      description: About 1 satoshi per byte. You pay for the size of the transaction, not for computation, so the fee stays flat and predictable.
    - label: Payment shows up
      figure: Seconds
      description: Wallets see a payment right away. Double-spend proofs warn merchants if someone tries to spend the same coins twice. Blocks confirm every 10 minutes on average.
    - label: Block size
      figure: 32 MB+
      description: The limit grows with sustained demand under the adaptive algorithm (ABLA). Today's blocks use a small fraction of it.
    - label: Supply
      figure: 21M
      description: A fixed supply, secured by SHA-256 proof of work. The history is shared with Bitcoin up to the 2017 split.
    - label: Native tokens
      figure: 20k+
      description: More than 20,000 CashToken categories are minted on-chain, with no token contract involved.
    - label: Upgrades
      figure: Every May
      description: CashTokens in 2023, adaptive blocks in 2024, more VM compute and big-number math in 2025, loops and functions in 2026.

utxo:
  chip: How it works
  title: You already understand UTXOs.
  body1: A UTXO is a coin. It has a value, a lock that says who can spend it, and a serial number. When you pay, you hand over whole coins and get change back, just like paper cash.
  body2: Bitcoin works this way too. Run a real transaction below and watch its coins get spent and minted. Then follow any coin back through history.
  moreAction: More on UTXOs →
  buildAction: Learn to build on BCH
  # Example transactions for the UTXO Machine demo.
  presets:
    - label: "Random: from the latest block"
      random: true
    - label: Woke up after 7 years
