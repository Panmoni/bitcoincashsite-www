limits:
  chip: Straight talk
  title: What BCH isn't (yet).
  intro: Every chain has trade-offs. Here are ours, so you can decide with the full picture.
  compareLink: Compare BCH with Bitcoin, Ethereum and Solana →
  items:
    - title: Small ecosystem
      description: A few hundred active builders and thin liquidity. Most people have never used a BCH app.
    - title: Not private by default
      description: BCH is a transparent ledger. You get self-custody and censorship resistance, not anonymity.
    - title: 10-minute blocks
      description: Payments show up in seconds, but wait for 6 or more blocks (about an hour) before you treat a large payment as final.
    - title: Less hash rate than Bitcoin Core (BTC)
      description: BCH shares the SHA-256 algorithm with Bitcoin and has a small fraction of its hash rate.

