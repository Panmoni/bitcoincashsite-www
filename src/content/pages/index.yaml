  title: What will you do with it?
  intro: Ship an app, open a till, mint a token or mine a block. Each path below takes you from zero to a first transaction.
  items:
    - title: Build on BCH
      description: The cheapest place to touch a real proof-of-work blockchain. Learn UTXO and covenants, which are Bitcoin skills, and ship apps where a test transaction costs about $0.001.
      icon: tabler:code
      url: /build
      size: wide
      tone: blue
    - title: Accept BCH
      description: A fee you can work out in your head, no chargebacks, and double-spend alerts for payments that haven't confirmed yet. Take BCH in a shop, online, or for freelance work.
      icon: tabler:cash-register
      url: /accept
      size: wide
    - title: Mint a CashToken
