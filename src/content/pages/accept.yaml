metadata:
  title: "Accept Bitcoin Cash: No Gas, Just Postage"
  description: "Accept Bitcoin Cash payments for under a cent per transaction. Payments show up in seconds, double-spend proofs flag fraud attempts, and there are no chargebacks."

hero:
  title: Accept Bitcoin Cash
  subtitle: No gas. Postage. A fee you can work out in your head, and money that lands in your own wallet.

merchantTools:
  title: Merchant Tools
  subtitle: Point-of-sale apps, invoicing and plugins that take BCH straight into a wallet you control.

gateways:
  subtitle: Payment Gateways (some convert to local currency for you)

video:
  title: YouTube video player

why:
  title: Why merchants take BCH
  subtitle: What you get, and what to watch out for.
  items:
    - title: Postage, not gas
      icon: tabler:mail
      description: You pay a flat rate per byte, about $0.001 for a typical payment. No fee auction, no percentage cut. The same sale costs the same to settle at 9am or during a rush.
    - title: Seen in seconds
      icon: tabler:bolt
      description: A payment shows up in your wallet within seconds, before it is in a block. Blocks come about every 10 minutes; for large sales you can wait for one.
    - title: Double-spend alerts
      icon: tabler:shield-check
      description: Nodes relay a double-spend proof if someone tries to spend the same coins twice. Payment tools can check a risk score before you hand over the goods.
    - title: No chargebacks
      icon: tabler:receipt-off
      description: A confirmed payment cannot be pulled back by a card network or a bank. Refunds are your decision, sent like any other payment.
    - title: Your wallet, your keys
      icon: tabler:key
      description: No merchant account to open and no processor that can freeze your balance. Funds go straight to keys you hold. Back them up.
    - title: "Price moves: plan for it"
      icon: tabler:chart-line
      description: BCH is volatile. If you price in local currency, convert on receipt through a gateway, or sweep to a stable balance on a schedule. Keep only what you want to hold.

cta:
  title: Get BCH Updates
  subtitle: Upgrades, tools and merchant news, without the hype.
  action: Get BCH updates
