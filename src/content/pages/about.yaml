principles:
  chip: Consensus rules
  title: Four rules we don't fork.
  intro: Every page on this site follows them. Here is what each one looks like in a sentence. Tell us when a page breaks one.
  'yes': We write
  'no': We don't
  rules:
  - code: rule_01 data_first
    title: Show the number.
    body: Fees, block sizes and upgrade dates. We show you the number, not an adjective.
    'yes': A test transaction costs about $0.001.
    'no': Near-zero fees, lightning fast!
    tone: bg-wb-green
  - code: rule_02 limits
    title: Say what's weak.
    body: BCH has a small ecosystem, thin liquidity, 10-minute blocks and no default privacy. We say so, next to the good parts.
    'yes': Payments show up in seconds. Final settlement takes about 10 minutes.
    'no': Instant, final payments.
    tone: bg-wb-yellow
  - code: rule_03 hands_on
    title: Let you try it.
    body: We point you at things you can try yourself, not things to take on faith.
    'yes': Send yourself a few cents and watch it arrive.
    'no': Trust us, it works.
    tone: bg-wb-blue
  - code: rule_04 no_price
    title: No price talk.
    body: We don't predict prices or promise returns. This site is about what BCH does.
    'yes': BCH is volatile. Hold only what you can afford to lose.
    'no': BCH to $10k by the next halving.
    tone: bg-wb-pink

limits:
  chip: Rule 2, in full
  title: Where BCH falls short.
  introBefore: The weak spots, in one place.
  introLink: Why Bitcoin Cash
  introAfter: covers the strong ones.
  columns:
    limit: Limit
    fact: In short
    meaning: What it means for you
  rows:
  - limit: Settlement
    fact: ~10 min per block
    meaning: Payments appear in seconds. For a large sale, wait for a block before you hand over the goods.
  - limit: Liquidity
    fact: thin
    meaning: Fewer exchanges and order books than BTC or stablecoins. Big trades move the price, so check the spread first.
  - limit: Privacy
    fact: public by default
    meaning: Anyone can read an address's history. Use a fresh address for each payment you receive.
  - limit: Ecosystem
    fact: small
    meaning: Fewer wallets, merchants and developers than larger chains. Ask a shop before you pay with it.

