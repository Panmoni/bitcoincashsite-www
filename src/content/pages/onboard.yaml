# Copy for src/pages/onboard.astro.
metadata:
  title: "Get a Bitcoin Cash Wallet — BCH Works"
  description: "Pick a self-custody Bitcoin Cash wallet, back up your recovery phrase, and send your first BCH for under a cent. Honest wallet picks, with CashTokens support noted."

hero:
  title: Get a Bitcoin Cash wallet
  subtitle: Five minutes to set up. No account, no permission, no bank. Your keys hold your coins.

basics:
  title: What a wallet actually does
  subtitle: Skip the jargon. Bitcoin Cash works like cash you carry, not like a bank account.
  items:
    - title: Your coins are coins
      icon: tabler:coins
      description: 'Every BCH you own is a separate coin (a "UTXO"): a value, a lock, and a serial number. Spending one is like handing over a bill and getting change back.'
    - title: The wallet holds the keys
      icon: tabler:key
      description: Your wallet stores the keys that unlock your coins. Nobody else has them. No company can freeze your wallet or close your account, because there is no account.
    - title: The recovery phrase is the wallet
      icon: tabler:lock
      description: Your 12 or 24 words can rebuild your wallet on any device. Write them down, keep copies in safe places, and never type them into a website. Lose them and nobody can help you.
    - title: Payments cost under a cent
      icon: tabler:receipt
      description: A typical transaction costs about $0.001. Payments show up in seconds and confirm in a block about every 10 minutes.
    - title: Tokens live in the same wallet
      icon: tabler:stack-2
      description: "Many BCH wallets also hold CashTokens: fungible tokens and NFTs that are part of the coin itself. No separate network, no gas token."
    - title: Transparent, not private
      icon: tabler:eye
      description: "Every transaction is on a public ledger. Your name is not, but addresses can be linked. Use a fresh address for each payment; your wallet does this for you."

# Starter picks: links come from the shared project data (matched by title); the "best for" copy lives here.
starter:
  title: Start with one of these
  subtitle: "{count} self-custody wallets we would hand a friend today. All are free."
  bestFor:
    Paytaca: Best for most people. Mobile and browser extension. Full CashTokens and NFT support.
    Cashonize: Best for tokens and apps. Web, desktop and Android. Connects to BCH apps via WalletConnect / CashConnect.
    Electron Cash: Best for power users. Desktop. CashTokens support, coin control and optional CashFusion.

all:
  title: Every BCH wallet we track
  subtitle: "More options, including multi-coin wallets. Check that a wallet is self-custody and still maintained before you trust it with money. <a class='underline' href='/wallet'>Compare them all feature by feature</a>."

hardware:
  subtitle: Hardware wallets, for savings you rarely touch

faq:
  title: Wallet FAQ
  subtitle: The questions people ask on day one.
  items:
    - title: Which wallet should I pick?
      description: If you are not sure, start with Paytaca on your phone. If you want to try BCH apps and tokens, add Cashonize. You can use more than one wallet; they all read the same chain.
    - title: Do I need to give my name or ID?
      description: Not to create a self-custody wallet. You may need ID to buy BCH on an exchange, depending on where you live and how you buy.
    - title: What if I lose my phone?
      description: Install a wallet on a new device and restore it with your recovery phrase. Your coins were never on the phone; they are on the chain, locked to your keys.
    - title: Can someone reverse a payment I send?
      description: No. Check the address before you send. Start with a small test payment; at about $0.001 per transaction, testing is nearly free.

video:
  title: YouTube video player

cta:
  title: Wallet ready?
  subtitle: Get a little BCH and send yourself a test payment. It costs less than a cent.
  next: "Next: get some BCH →"
  updates: Get BCH updates
