  rate: Fee rate (sat/byte)
  price: BCH price, USD (example)
  result: Network fee
  initialUsd: $0.0010
  initialSats: 226 sats

limits:
  title: Limits to design around.
  intro: True today. We update this list when a limit changes.
  columns:
    rating: Limit
    status: Status
    why: Why
  rows:
  - rating: Global shared-state contracts
    status: Not supported
    why: By design. A contract is a lock on a coin.
  - rating: Sub-second finality
    status: Not supported
    why: Blocks average 10 minutes.
  - rating: Privacy by default
    status: Not supported
    why: Transparent ledger. CashFusion is opt-in.
  - rating: Deep liquidity
    status: Low
    why: DeFi is measured in millions, not billions.
  - rating: USDT / USDC on L1
    status: Not available
    why: An issuer decision, not a protocol limit.
  - rating: Hash rate vs. Bitcoin
    status: Small fraction
    why: Same SHA-256 algorithm, far less work.

honest:
  title: The honest part
  subtitle: What to expect before you commit your time.
  items:
  - title: Harder than Solidity at first
    icon: tabler:brain
    description: There is no global state to read and write. You design with coins that are spent and created, and shared pools need care to avoid contention.
  - title: A small ecosystem
    icon: tabler:users
    description: Fewer developers, fewer libraries and thin liquidity. You will ship sooner and stand out more, but you will also answer your own questions more often.
  - title: Bugs are still bugs
    icon: tabler:bug
    description: No admin keys means no one can patch a broken contract. Test on chipnet, step through the VM in Bitauth IDE and keep value limits low at launch.

