why:
  title: Why learn to build on BCH
  subtitle: 'A UTXO is a coin: a value, a lock and a serial number. You already understand it from cash. Bitcoin Cash lets you program the lock.'
  items:
  - title: UTXO skills are Bitcoin skills
    icon: tabler:currency-bitcoin
    description: Script, coin selection, signing and fee math work the same way on Bitcoin. The model also carries over to Cardano, Kaspa, Ergo and Sui-style objects.
  - title: Tutorials cost a tenth of a cent
    icon: tabler:receipt
    description: A mainnet test transaction costs about $0.001. You can break things on a real proof-of-work chain for pocket change, not $20 of gas.
  - title: Covenants you can run today
    icon: tabler:lock-code
    description: Introspection opcodes let a contract check where its coins go. Vaults, allowances, escrow and recurring payments are live, not proposals.
  - title: More compute since 2025
    icon: tabler:cpu
    description: The May 2025 upgrade replaced opcode counts with a density-based cost budget and added BigInt, so contracts can do arbitrary-precision math.
  - title: Loops and functions since 2026
    icon: tabler:repeat
    description: The May 2026 upgrade added loops, reusable functions, bitwise ops and pay-to-script outputs. CashScript 0.13 supports loops, bitwise ops and P2S.
  - title: No admin keys, no approvals
    icon: tabler:shield-check
    description: Covenants are fixed bytecode with no owner and no upgradeable proxy. Tokens are native, so there is no approve() for an attacker to abuse.

specSheet:
  chip: Spec sheet · rev. 2026-05
  title: The numbers you design against.
  intro: Typical mainnet values, and the limits to design around. Datasheets list their limits, and so does this one.
  columns:
    param: Parameter
    typ: Typical
    note: Notes
  rows:
  - param: Relay fee
    typ: 1 sat/byte
    note: Flat per byte. No auction, so no spike at peak load.
  - param: Payment size
    typ: ~226 bytes
    note: 1 input, 2 outputs (P2PKH).
  - param: Time to seen
    typ: ~2 s
    note: Relayed with double-spend proofs and a risk score.
  - param: Block interval
    typ: 10 min
    note: Same target as Bitcoin.
  - param: Block size limit
    typ: 32 MB floor
    note: 'Adaptive since 2024: grows with sustained demand.'
  - param: Integers
    typ: BigInt
    note: Arbitrary-precision math since May 2025.
  - param: Control flow
    typ: Loops, functions
    note: Since May 2026, with bitwise ops and P2S outputs.
  - param: Tokens
    typ: Native
    note: Fungible tokens and NFTs inside UTXOs. No contract deploy.
  - param: Upgrade cadence
    typ: Yearly, May 15
    note: Six months on chipnet first.

