article:
  coin:
    title: A UTXO is a coin, not a balance
    body: 'Your bank keeps one number for you and edits it. Bitcoin Cash does not. It keeps a pile of separate coins, and each coin is locked to whoever holds the right key. Each coin is a <strong>UTXO</strong>: an output of some earlier transaction that nobody has spent yet. Your wallet "balance" is only the sum of the coins your keys can open.'
  spending:
    title: Spending melts coins and mints new ones
    body: "A coin is always spent whole. Say you hold a 5 BCH coin and pay someone 3 BCH. Your transaction consumes the 5 BCH coin as an <em>input</em> and creates two <em>outputs</em>: 3 BCH locked to the payee, and about 2 BCH back to you as change. The old coin no longer exists. The two new ones join the UTXO set."
    fee: "The outputs add up to a little less than the inputs. That gap is the fee, and the miner who puts the transaction in a block collects it. On Bitcoin Cash it is usually about a satoshi per byte: a fraction of a cent."
  tree:
    title: Every coin has a family tree
    body: 'Each input points at the exact output it spends, so every coin links back to its parents, and theirs, all the way to a <strong>coinbase</strong>: the transaction in which a miner created new coins as the block reward. That is what "Follow a coin" walks. Some trails end a few steps back. Others run through years of sleep and cross the August 2017 split, when BCH and BTC still shared one ledger.'
  why:
    title: Why Bitcoin Cash uses UTXOs
    items:
      - "<strong>Parallel checks.</strong> Coins are independent, so a node can validate many transactions at once."
      - "<strong>No shared state to drain.</strong> A transaction spends specific coins, or it fails. There is no contract balance for a bug to empty."
      - '<strong>Tokens ride along.</strong> <a href="/cashtokens">CashTokens</a> live inside outputs too, so a token moves under the same rules and the same signatures as BCH.'
      - "<strong>Better privacy by default.</strong> Wallets can use a fresh address for each coin, instead of one account that shows every payment."
    tradeoff: 'The trade-off is that wallets must choose which coins to spend, and many tiny coins make larger transactions. See the <a href="/glossary">glossary</a> for the terms and <a href="/wallet">the wallet chooser</a> for wallets that handle it for you.'

charts:
  intro: "Every coin that exists, grouped by how long it has sat still. We compute this ourselves from a Bitcoin Cash Node, and check our count against the node's own <code class=\"font-mono text-base\">coinstatsindex</code> total every day. No third-party analytics API."
  unpublished: 'These charts come from <code class="font-mono">scripts/utxo-stats.mjs</code> run against a BCHN node with <code class="font-mono">-coinstatsindex</code>. The machine above works now: it reads the chain live.'
  method:
    - "We read every block from genesis with <code class=\"font-mono\">getblock</code> verbosity 3, which lists each input's prevout height and value. Each output adds its value to the day it was born. Each input takes its value back out and destroys value × age coin-days. Ages count whole UTC days, by block median time."
    - 'At the end of each day we ask the node for its UTXO-set total with <code class="font-mono">gettxoutsetinfo</code>, served by <code class="font-mono">-coinstatsindex</code>. If our count differs by one satoshi, the job fails instead of publishing. OP_RETURN outputs and the two BIP30 duplicate coinbases are excluded, as the node excludes them.'
    - 'We skip the newest {confirmations} blocks, so a reorg cannot reach the data. Coins born before August 1, 2017 exist on both BCH and BTC; "7+ years" includes coins that never moved after the split.'

faq:
  title: Questions
  items:
    - q: What does UTXO stand for?
      a: "Unspent transaction output. Every transaction creates outputs: amounts locked to an address or script. An output that nobody has spent yet is a UTXO. Your wallet balance is the sum of the UTXOs your keys can unlock."
    - q: Is a UTXO like a coin or a bill?
      a: "Yes. A UTXO is spent whole, like a banknote. To pay 3 BCH with a 5 BCH coin, the transaction consumes the 5 BCH coin and creates two new ones: 3 BCH for the payee and about 2 BCH back to you as change, minus a small fee."
    - q: How is the UTXO model different from Ethereum's account model?
      a: Ethereum keeps one balance per account and edits it in place. Bitcoin Cash keeps a set of separate coins and replaces them. Coins can be checked in parallel, a transaction either spends a coin or it does not, and there is no global contract state to drain.
    - q: Where does the transaction fee go?
      a: Nowhere explicit. The fee is the gap between what the inputs hold and what the outputs hold. The miner who includes the transaction claims that gap in the block's coinbase transaction.
    - q: What is the UTXO set?
      a: "The list of every unspent output on the chain: all the money that exists right now. Full nodes keep it in a database to check each new transaction. It is the ledger, and it holds only coins, not account histories."
    - q: What are coin-days destroyed?
      a: A measure of how old the moved money was. Spend 10 BCH that sat still for 100 days and you destroy 1,000 coin-days. Big spikes mean long-held coins moved, which analysts watch as a signal of old holders selling or reorganising.
    - q: Do CashTokens use UTXOs too?
      a: Yes. Since May 2023, every Bitcoin Cash output can carry fungible tokens or an NFT alongside its BCH. Tokens move by spending and recreating outputs, exactly like BCH itself. The machine marks token outputs with a pink ring.

sources: 'The machine reads the chain live over the Electrum Cash protocol from public <a class="underline" href="https://github.com/cculianu/Fulcrum" target="_blank" rel="noopener noreferrer">Fulcrum</a> servers. It sends them transaction IDs, nothing else. The UTXO-set charts come from our own <a class="underline" href="https://bitcoincashnode.org" target="_blank" rel="noopener noreferrer">Bitcoin Cash Node</a>.'
