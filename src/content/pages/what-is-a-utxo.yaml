metadata:
  title: "What Is a UTXO? Watch Real Coins Get Spent"
  description: "A UTXO is an unspent transaction output: a coin. Feed the UTXO Machine a real Bitcoin Cash transaction, watch coins get consumed and minted, and follow any coin back to the block that created it."

hero:
  chip: The UTXO Machine
  title: What is a UTXO? Watch real coins get spent.
  subtitle: A UTXO (unspent transaction output) is a coin. Every Bitcoin Cash transaction melts some coins down and mints new ones. Paste any transaction below and watch it happen, then follow a coin back to the block that created it.

