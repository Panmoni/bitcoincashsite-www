# Copy for src/pages/buy.astro.
metadata:
  title: "Buy Bitcoin Cash BCH: Exchanges, Swaps and ATMs"
  description: "How to buy and sell Bitcoin Cash safely: exchanges, crypto swaps and ATMs. Move your BCH to a wallet you control and send it abroad for under a cent."

hero:
  title: Buy & Sell Bitcoin Cash
  subtitle: Buy it, move it to your own wallet, and send it anywhere for under a cent.

exchanges:
  title: How to Buy & Sell BCH
  subtitle: Pick a reputable exchange, buy a small amount first, and withdraw to a wallet whose recovery phrase you have backed up. Coins left on an exchange belong to the exchange until you withdraw them.
  highlight: Buy some BCH

swaps:
  subtitle: Crypto-to-Crypto Swaps

atms:
  subtitle: Bitcoin Cash ATMs

video:
  title: YouTube video player

before:
  title: Before you buy
  subtitle: What BCH is good for, and the risks to accept up front.
  items:
    - title: Send money home
      icon: tabler:send
      description: Buy BCH, send it to family abroad for about $0.001, and they can spend it or sell it locally. No forms, no transfer office.
    - title: Under a cent to move
      icon: tabler:cash
      description: Moving BCH costs about the same for $5 or $5,000. Exchange spreads and withdrawal fees vary, so compare them.
    - title: Self-custody
      icon: tabler:key
      description: "Once BCH is in your wallet, no one can freeze it. Also no one can recover it for you: back up your recovery phrase."
    - title: Fixed supply
      icon: tabler:lock
      description: There will only ever be 21 million BCH. No one can print more. That does not make the price stable.
    - title: Volatility is real
      icon: tabler:chart-line
      description: BCH can drop or rise sharply in a day. It is not a guaranteed safe haven. Buy only what you can afford to lose, and never on a promise of returns.
    - title: Watch for scams
      icon: tabler:alert-triangle
      description: No real exchange asks for your recovery phrase. Ignore "double your BCH" offers and people who contact you first.

cta:
  title: Get BCH Updates
  subtitle: Upgrades, tools and ecosystem news, without the hype.
  action: Get BCH updates
