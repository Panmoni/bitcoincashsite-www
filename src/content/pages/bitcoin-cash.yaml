metadata:
  title: Why Bitcoin Cash? The case against BCH, answered
  description: The strongest objections to Bitcoin Cash (BCH), each answered, contested or conceded. Plus how BCH compares with Bitcoin, Ethereum and Solana, and which chain fits which job.

hero:
  chip: The skeptic's case
  titleHtml: Why <mark class="bg-wb-green text-on-accent px-[0.12em] rounded-[0.12em] [box-decoration-break:clone]">Bitcoin Cash</mark>? Here's the case against.
  intro: Bitcoin Cash (BCH) is Bitcoin that kept the peer-to-peer cash plan. Below are the strongest objections to it, with a straight answer to each. The verdicts are ours at BCH Works. The BCH community holds a range of views, and not everyone will agree. Some we win, some are still open, and some we concede.

