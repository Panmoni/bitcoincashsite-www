name: Refresh directory health and metrics

# Daily: ping every directory project, snapshot chain metrics, commit the
# results. The commit to main triggers the site rebuild, so the static pages
# carry fresh data and fresh "checked" dates.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot chain metrics
        run: node scripts/metrics.mjs
      - name: Check project health
        run: node scripts/health-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runs even when a script above failed, so good data still lands; the
      # failed step keeps the run red, and GitHub emails the failure.
      - name: Commit if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/health.json src/data/metrics.json
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore(data): refresh directory health and chain metrics"
          # Someone may have pushed to main while the checks ran.
          git pull --rebase origin main
          git push origin HEAD:main
