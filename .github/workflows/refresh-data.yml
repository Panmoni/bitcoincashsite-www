name: Refresh directory health and metrics

# Daily: ping every directory project, snapshot chain metrics, commit the
# results. The commit to main triggers the site rebuild, so the static pages
# carry fresh data and fresh "checked" dates.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot chain metrics
        run: node scripts/metrics.mjs
      - name: Check project health
        run: node scripts/health-check.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "bchworks-bot"
          git config user.email "bot@bchworks.com"
          git add src/data/health.json src/data/metrics.json
          git diff --cached --quiet || git commit -m "chore(data): refresh directory health and chain metrics"
          git push
